name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Cho phép trigger thủ công

env:
  NODE_VERSION: '16'

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    # Chỉ chạy khi push vào nhánh main
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Nếu bạn sử dụng Docker Hub
      - name: Login to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build và push Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server App
        if: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./server_app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clothes-server:latest
            ${{ secrets.DOCKER_USERNAME }}/clothes-server:${{ github.sha }}

      - name: Build and Push Client App
        if: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./client_app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clothes-client:latest
            ${{ secrets.DOCKER_USERNAME }}/clothes-client:${{ github.sha }}

      - name: Build and Push Admin App
        if: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./admin_app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clothes-admin:latest
            ${{ secrets.DOCKER_USERNAME }}/clothes-admin:${{ github.sha }}

      # Deploy lên server (VPS/Cloud)
      # Uncomment và cấu hình khi bạn có server
      # - name: Deploy to Server via SSH
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd /path/to/your/app
      #       docker compose pull
      #       docker compose up -d
      #       docker system prune -af

      - name: Deployment Success
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Version: ${{ github.sha }}"
