name: Development Branch CI

on:
  push:
    branches:
      - giai-doan-1
      - giai-doan-2
      - giai-doan-3
      - giai-doan-4
      - DUCTOAN
      - phat
      - kiet
  pull_request:
    branches:
      - main

jobs:
  # Quick validation for development branches
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Check Server App
        working-directory: ./server_app
        run: |
          echo "📦 Installing server dependencies..."
          npm install
          echo "✅ Server dependencies installed successfully"

      - name: Check Client App
        working-directory: ./client_app
        run: |
          echo "📦 Installing client dependencies..."
          npm install
          echo "🏗️ Building client app..."
          npm run build
          echo "✅ Client app built successfully"

      - name: Check Admin App
        working-directory: ./admin_app
        run: |
          echo "📦 Installing admin dependencies..."
          npm install
          echo "🏗️ Building admin app..."
          npm run build
          echo "✅ Admin app built successfully"

      - name: Summary
        run: |
          echo "================================"
          echo "✅ All checks passed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"
