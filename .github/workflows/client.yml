name: Frontend CI - client_app & admin_app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache client_app node_modules
        uses: actions/cache@v4
        with:
          path: client_app/node_modules
          key: client-app-${{ matrix.node-version }}-npm-${{ hashFiles('client_app/package-lock.json') }}
          restore-keys: client-app-${{ matrix.node-version }}-npm-

      - name: Cache admin_app node_modules
        uses: actions/cache@v4
        with:
          path: admin_app/node_modules
          key: admin-app-${{ matrix.node-version }}-npm-${{ hashFiles('admin_app/package-lock.json') }}
          restore-keys: admin-app-${{ matrix.node-version }}-npm-

      - name: Install client_app dependencies
        working-directory: ./client_app
        run: npm ci || npm install

      - name: Build client_app
        working-directory: ./client_app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build --if-present

      - name: Run client_app tests
        working-directory: ./client_app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm test --if-present

      - name: Install admin_app dependencies
        working-directory: ./admin_app
        run: npm ci || npm install

      - name: Build admin_app
        working-directory: ./admin_app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build --if-present

      - name: Run admin_app tests
        working-directory: ./admin_app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm test --if-present