# CI/CD Workflow for MERN Stack Application
# This workflow includes jobs for testing, linting, building, and deploying the server, client, and admin applications.
# Improvements:
# - Upgraded Node.js to 18.x (LTS).
# - Added extensive logging to show versions, current processes, and build contexts.
# - Implemented npm caching across all relevant jobs for faster execution.
# - Refactored frontend tests and linting into matrix jobs for parallelism and cleaner code.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - kiet
      - DUCTOAN
      - babyfat
      - phat
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18.x' # Using Node.js 18 LTS
  MONGO_URL: mongodb://localhost:27017/Clothes_Test

jobs:
  # ====================================================================
  # ========================= SERVER TESTS =============================
  # ====================================================================
  server-tests:
    name: Server Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js and Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server_app/package-lock.json

      - name: 3. Log Environment Details
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: 4. Install server dependencies
        working-directory: ./server_app
        run: |
          echo "Installing server dependencies..."
          npm ci --no-audit --no-fund --prefer-offline

      - name: 5. Install mongosh
        run: npm install -g mongosh

      - name: 6. Verify MongoDB Connection
        run: |
          echo "Pinging MongoDB to verify connection..."
          mongosh ${{ env.MONGO_URL }} --eval 'db.runCommand({ ping: 1 })' --quiet
          echo "MongoDB connection successful."

      - name: 7. Run server tests with coverage
        working-directory: ./server_app
        run: |
          echo "Running server tests..."
          npx jest \
            --ci \
            --coverage \
            --coverageReporters=lcov,text-summary \
            --maxWorkers=100% \
            --passWithNoTests \
            --coverageThreshold='{"global":{"statements":0,"branches":0,"lines":0,"functions":0}}'
        env:
            MONGO_URL: ${{ env.MONGO_URL }}
            JWT_SECRET: test_secret_key_for_ci
            NODE_ENV: test

      - name: 8. Upload server coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./server_app/coverage/lcov.info
          flags: server
          name: server-coverage
          fail_ci_if_error: false
          verbose: false

  # ====================================================================
  # ======================= FRONTEND TESTS =============================
  # ====================================================================
  frontend-tests:
    name: ${{ matrix.app }} Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [server-tests] # Run after server tests
    strategy:
      matrix:
        app: [client, admin]

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js and Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}_app/package-lock.json

      - name: 3. Log Environment Details
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: 4. Install ${{ matrix.app }} dependencies
        working-directory: ./${{ matrix.app }}_app
        run: |
          echo "Installing dependencies for ${{ matrix.app }}..."
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 5. Run ${{ matrix.app }} tests
        working-directory: ./${{ matrix.app }}_app
        run: |
          echo "Running tests for ${{ matrix.app }}..."
          npm run test:ci
        env:
          REACT_APP_API_URL: http://localhost:8000/

      - name: 6. Upload ${{ matrix.app }} coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.app }}_app/coverage/lcov.info
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage
          fail_ci_if_error: false
          verbose: false

  # ====================================================================
  # ===================== LINTING & CODE QUALITY =======================
  # ====================================================================
  lint:
    name: ${{ matrix.app }} Code Quality & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, client, admin]

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js and Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}_app/package-lock.json

      - name: 3. Install dependencies and run linter
        working-directory: ./${{ matrix.app }}_app
        run: |
          echo "Installing dependencies for ${{ matrix.app }} linting..."
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          echo "Running linter for ${{ matrix.app }}..."
          npm run lint

  # ====================================================================
  # ===================== BUILD DOCKER IMAGES ==========================
  # ====================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, frontend-tests]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, client, admin]

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sgu-${{ matrix.app }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 5. Log build context and metadata
        run: |
          echo "Branch name: ${{ github.ref_name }}"
          echo "Git ref:     ${{ github.ref }}"
          echo "Commit SHA:  ${{ github.sha }}"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "---"
          echo "Listing files in build context: ./${{ matrix.app }}_app"
          ls -la ./${{ matrix.app }}_app

      - name: 6. Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}_app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ====================================================================
  # ======================= DEPLOY TO PRODUCTION =======================
  # ====================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Deploy to server
        run: |
          echo "Deployment step initiated for main branch."
          echo "This is where you would add your deployment commands."
          echo "For example: ssh into a server and run docker-compose pull && docker-compose up -d"
