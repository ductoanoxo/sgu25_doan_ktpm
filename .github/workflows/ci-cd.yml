name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, kiet ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '16.x'
  MONGO_URL: mongodb://localhost:27017/Clothes_Test

jobs:
  # ============= SERVER TESTS =============
  server-tests:
    name: Server Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server_app/package-lock.json

      - name: Install server dependencies
        working-directory: ./server_app
        run: npm ci

      - name: Run server unit tests
        working-directory: ./server_app
        continue-on-error: true
        run: npm run test:unit
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          JWT_SECRET: test_secret_key_for_ci
          NODE_ENV: test

      - name: Run server integration tests
        working-directory: ./server_app
        continue-on-error: true
        run: npm run test:integration
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          JWT_SECRET: test_secret_key_for_ci
          NODE_ENV: test

      - name: Generate server coverage report
        working-directory: ./server_app
        continue-on-error: true
        run: npm run test:coverage
        env:
          MONGO_URL: ${{ env.MONGO_URL }}
          JWT_SECRET: test_secret_key_for_ci
          NODE_ENV: test

      - name: Upload server coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./server_app/coverage/lcov.info
          flags: server
          name: server-coverage
          fail_ci_if_error: false
          verbose: true

  # ============= CLIENT TESTS =============
  client-tests:
    name: Client Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client_app/package-lock.json

      - name: Install client dependencies
        working-directory: ./client_app
        run: npm ci

      - name: Run client tests
        working-directory: ./client_app
        continue-on-error: true
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000/

      - name: Upload client coverage
        uses: codecov/codecov-action@v3
        with:
          flags: client
          directory: ./client_app/coverage

  # ============= ADMIN TESTS =============
  admin-tests:
    name: Admin Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install admin dependencies
        working-directory: ./admin_app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run admin tests
        working-directory: ./admin_app
        continue-on-error: true
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000/

      - name: Upload admin coverage
        uses: codecov/codecov-action@v3
        with:
          flags: admin
          directory: ./admin_app/coverage

  # ============= LINTING & CODE QUALITY =============
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint server code
        working-directory: ./server_app
        run: |
          npm ci
          npm run lint || true

      - name: Lint client code
        working-directory: ./client_app
        run: |
          npm ci
          npm run lint || true

      - name: Lint admin code
        working-directory: ./admin_app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run lint || true
