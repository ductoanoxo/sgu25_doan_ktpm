name: E2E Tests

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main, develop, kiet]
  workflow_dispatch:

env:
  NODE_VERSION: '16.x'
  MONGO_URL: mongodb://localhost:27017/Clothes_Test

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install all dependencies
        run: |
          cd server_app && npm ci && cd ..
          cd client_app && npm ci && cd ..
          cd admin_app && npm ci && cd ..

      - name: Start services
        run: |
          cd server_app
          npm start &
          SERVER_PID=$!
          sleep 10
          cd ../client_app
          npm start &
          CLIENT_PID=$!
          sleep 15
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "CLIENT_PID=$CLIENT_PID" >> $GITHUB_ENV
        env:
          MONGO_URL: mongodb://localhost:27017/Clothes_Test
          JWT_SECRET: test_secret_key_for_ci

      - name: Run E2E tests
        working-directory: ./client_app
        run: npm run test:e2e || true

      - name: Stop services
        if: always()
        run: |
          kill ${{ env.SERVER_PID }} || true
          kill ${{ env.CLIENT_PID }} || true
